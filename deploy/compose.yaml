name: gongming

services:
  db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: gongming
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-gongming-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [database]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_ADDR: :8080
      COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin},${ADMIN_ORIGIN:?Set ADMIN_ORIGIN to the admin HTTPS origin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_HANDLE: ${BOOTSTRAP_ADMIN_HANDLE:-}
    secrets:
      - postgres_password
      - bootstrap_admin_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [database, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8081}:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: admin
      args:
        VITE_FRONTEND_URL: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${ADMIN_PORT:-8082}:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

networks:
  database:
    internal: true
  edge: {}

volumes:
  postgres-data: {}

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Set POSTGRES_ADMIN_PASSWORD_FILE to a secret file path}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a secret file path}
  bootstrap_admin_password:
    file: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:?Set BOOTSTRAP_ADMIN_PASSWORD_FILE to a secret file path}
